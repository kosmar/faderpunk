[workspace]
members = ["faderpunk", "libfp"]

exclude = ["gen-bindings"]

resolver = "2"

[profile.release]
lto = true
incremental = false
codegen-units = 1
debug = 2
# "abort" instead of "immediate-abort": the panic handler must still run so
# tasks::panic_beacon can report the panic site over MIDI.
panic = "abort"

[profile.dev]
lto = true
opt-level = "z"
panic = "abort"
